[build]
  publish = "."

# Portál 12 Weeks Race Prep: PDF jsou dostupná jen přes funkci /api/portal-files (po přihlášení)
[functions]
  included_files = ["portal-files/**"]

[[redirects]]
  from = "/portal-files/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# www a Netlify adresa -> hlavní doména, aby Google indexoval jen hyroxtrainingclub.cz
[[redirects]]
  from = "https://www.hyroxtrainingclub.cz/*"
  to = "https://hyroxtrainingclub.cz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hyrox-training-club.netlify.app/*"
  to = "https://hyroxtrainingclub.cz/:splat"
  status = 301
  force = true

# Bezpečnostní hlavičky pro celý web
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
